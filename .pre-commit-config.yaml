repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests|benchmarks)/.*\.py$
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(src|tests|benchmarks)/.*\.py$
        require_serial: true

      - id: pyright
        name: pyright
        entry: uv run python -m pyright
        language: system
        pass_filenames: false
        files: ^(src|tests|benchmarks)/.*\.py$
        require_serial: true