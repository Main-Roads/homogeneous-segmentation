[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homogeneous-segmentation"
version = "2.2.0.dev0"
authors = [
    { name = "Yongze Song", role="author of original R package named HS" },
    { name = "Nicholas Archer", role = "port to python" },
    { name = "Dagmawi Tadesse", role = "NumPy/Numba optimization and maintenance" }
]
license = "GPL-2.0-only"
description = "Homogeneous segmentation of linear spatial data using SHS and MCV methods ported from the R HS package, with legacy pandas and optimized NumPy/Numba backends."
readme = "README.md"

dependencies = [
    "numba>=0.60.0",
    "numpy>=2.0.2",
    "pandas",
]
requires-python = ">=3.9"

[project.urls]
"Homepage" = "https://github.com/thehappycheese/homogeneous-segmentation"
"Original R Package" = "https://cran.r-project.org/web/packages/HS/index.html"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7,<4.0",
    "pyright[nodejs]>=1.1",
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
  "tests"
]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests", "benchmarks"]
extend-exclude = ["*.ipynb", "dist", "ephemerals", "merge-segments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[tool.pylint]
max-line-length = 88
